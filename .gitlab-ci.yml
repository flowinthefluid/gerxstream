image: python:3.12-slim

stages:
  - test
  - deploy

tests:
  stage: test
  script:
    - python -m pip install --quiet pytest
    - python -m pytest tests/ -q

pages:
  stage: deploy
  script:
    - bash tools/build-gitlab-pages.sh "$CI_PAGES_URL"
  artifacts:
    paths:
      - public
  only:
    - main
